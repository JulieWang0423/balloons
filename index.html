<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>最后一天的行李</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: full-screen retro sky; answers rise as balloons from behind a paper-like input card at the bottom. Single theme by choice. */
:root {
  --sky-top: #6f9fc8;
  --sky-mid: #a9c8e0;
  --sky-low: #e6eef0;
  --paper: #fbf6ea;
  --ink: #3a4654;
  --ink-soft: #6b7887;
  --accent: #c8735a;
  --font-display: "Nunito", "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-en: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Nunito", "Noto Serif SC", "Songti SC", "STSong", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sky-mid);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#stage {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
}
#clouds, #grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#grain { opacity: .16; mix-blend-mode: multiply; background-size: 180px 180px; }
#sky { position: absolute; inset: 0; overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent 70px, #000 150px);
          mask-image: linear-gradient(to bottom, transparent 0, transparent 70px, #000 150px); }

/* header */
header {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  padding: calc(env(safe-area-inset-top) + 18px) 20px 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding-bottom: 28px;
  background: linear-gradient(to bottom, rgba(96,142,184,.55) 0%, rgba(96,142,184,.35) 60%, rgba(96,142,184,0) 100%);
  pointer-events: none; text-align: center;
}
.troupe { font-family: var(--font-en); font-weight: 700; font-size: 14px; color: #f6f1e4; letter-spacing: .04em; text-shadow: 0 1px 2px rgba(40,60,80,.25); }
.show { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: #fff; letter-spacing: .2em; text-shadow: 0 1px 3px rgba(40,60,80,.35); }

/* bottom card */
#ask {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 6;
  transform: translateX(-50%);
  width: min(560px, calc(100% - 32px));
  background: var(--paper);
  border-radius: 6px;
  padding: 18px 18px 14px;
  box-shadow: 0 10px 30px rgba(40,70,100,.22), 0 1px 0 rgba(255,255,255,.6) inset;
  display: flex; flex-direction: column; gap: 10px;
}
#ask::before { /* stamp-like perforated top edge */
  content: ""; position: absolute; left: 10px; right: 10px; top: -5px; height: 10px;
  background: radial-gradient(circle at 5px 5px, var(--paper) 4px, transparent 4.5px) 0 0 / 14px 10px repeat-x;
}
.q-zh { font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.65; margin: 0; text-wrap: balance; }
.q-en { font-family: var(--font-en); font-weight: 600; font-size: 14.5px; line-height: 1.35; color: var(--ink-soft); margin: 0; }
.row { display: flex; gap: 8px; align-items: stretch; }
#answer {
  flex: 1; min-width: 0;
  font: 16px/1.4 var(--font-body); color: var(--ink);
  background: #fff; border: 1px solid #ddd3bd; border-radius: 4px;
  padding: 10px 12px; resize: none; height: 46px;
}
#answer:focus { outline: 2px solid var(--sky-top); outline-offset: 1px; }
#send {
  font: 600 16px var(--font-display); letter-spacing: .1em;
  background: var(--accent); color: #fff; border: 0; border-radius: 4px;
  padding: 0 18px; cursor: pointer; white-space: nowrap;
}
#send:disabled { background: #d9c7b8; cursor: default; }
#send:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { display: flex; justify-content: flex-end; font: 600 12px var(--font-en); color: var(--ink-soft); min-height: 14px; }
.anon { font: 600 12px var(--font-en); color: #fff; letter-spacing: .03em; text-shadow: 0 1px 3px rgba(40,60,80,.4); }

/* balloons */
.balloon {
  position: absolute; bottom: -160px; left: 0;
  animation: rise var(--dur) linear forwards;
  animation-delay: var(--delay, 0s);
  will-change: transform;
}
@keyframes rise { from { transform: translateY(0); } to { transform: translateY(calc(-100vh - 260px)); } }
.sway { animation: sway var(--sway) ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes sway { from { transform: translateX(-10px) rotate(-3deg); } to { transform: translateX(10px) rotate(3deg); } }
.body {
  position: relative; width: var(--w); min-height: calc(var(--w) * 1.08);
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 16px 14px 20px;
  background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.75), rgba(255,255,255,0) 38%), var(--c);
  border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
  box-shadow: inset -6px -8px 14px rgba(0,0,0,.08), 0 6px 14px rgba(50,80,110,.15);
  font-size: 13px; font-weight: 600; line-height: 1.4; color: #3f3a36;
  cursor: pointer; border: 0; font-family: var(--font-body);
}
.body span { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; word-break: normal; hyphens: auto; }
.body:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.knot { width: 10px; height: 8px; margin: -3px auto 0; background: var(--c); clip-path: polygon(50% 0, 100% 100%, 0 100%); filter: brightness(.92); }
.string { display: block; margin: 0 auto; }
.balloon.gone { opacity: 0; transition: opacity .8s; }
.balloon.mine .body { box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 0 24px rgba(255,240,200,.9), inset -6px -8px 14px rgba(0,0,0,.08); }
.balloon.new .body::after {
  content: "刚刚"; position: absolute; top: -6px; right: -4px; font-size: 10px;
  background: var(--paper); color: var(--accent); padding: 1px 6px; border-radius: 8px;
}

/* modal */
#modal { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: rgba(60,85,110,.35); padding: 24px; }
#modal.open { display: flex; }
.card { background: var(--paper); border-radius: 6px; max-width: 360px; width: 100%; padding: 26px 22px 18px; box-shadow: 0 20px 50px rgba(30,50,70,.3); display: flex; flex-direction: column; gap: 14px; }
.card p { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.6; word-break: break-word; }
.card .when { font-size: 12px; color: var(--ink-soft); font-family: var(--font-body); }
.card button { align-self: flex-end; background: none; border: 1px solid #d8ccb4; border-radius: 4px; padding: 6px 14px; font: 14px var(--font-body); color: var(--ink); cursor: pointer; }

#toast { white-space: nowrap; position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 9; background: rgba(251,246,234,.95); padding: 10px 18px; border-radius: 20px; font-family: var(--font-display); font-weight: 600; font-size: 16px; opacity: 0; transition: opacity .4s; pointer-events: none; }
#toast.show { opacity: 1; }

#demo[hidden] { display: none; }
#demo { position: absolute; top: calc(env(safe-area-inset-top) + 92px); left: 50%; transform: translateX(-50%); z-index: 5; font-size: 11px; color: #33506b; background: rgba(255,255,255,.55); padding: 3px 10px; border-radius: 10px; white-space: nowrap; }

@media (max-width: 359px) {
  .q-zh { font-size: 16px; line-height: 1.6; }
  .q-en { font-size: 13px; }
  #ask { padding: 14px 14px 10px; gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .balloon { animation: none; bottom: auto; top: var(--y); }
  .sway { animation: none; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="clouds"></canvas>
  <div id="grain"></div>
  <div id="sky" aria-live="polite"></div>
</div>

<header>
  <div class="troupe">Lingxi Chinese Theatre at UVA</div>
  <div class="show">《未完待续》</div>
  <div class="anon">匿名留言 / anonymous</div>
</header>
<div id="demo" hidden></div>

<form id="ask" autocomplete="off">
  <p class="q-zh">如果死神今天来到你身边，告诉你只剩最后一天，你可以带一样东西去另一个世界——你会带什么？</p>
  <p class="q-en">If you could take one thing with you into the next world, what would it be?</p>
  <div class="row">
    <label for="answer" style="position:absolute;left:-9999px">你的答案</label>
    <textarea id="answer" maxlength="60"></textarea>
    <button id="send" type="submit" disabled>放飞</button>
  </div>
  <div class="meta"><span id="count"></span></div>
</form>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mtext">
  <div class="card"><p id="mtext"></p><div class="when" id="mwhen"></div><button id="mclose" type="button">放它回去</button></div>
</div>
<div id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
